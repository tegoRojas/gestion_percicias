<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IITCUP - Gestor Pericial Regional Santa Cruz</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#004d25" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IITCUP PWA" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registrado con éxito:', reg.scope))
            .catch(err => console.log('Error registro SW:', err));
        });
      }
    </script>
  </body>
</html>
